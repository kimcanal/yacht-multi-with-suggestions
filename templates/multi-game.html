<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎲 Yacht - Multiplayer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a3e 100%);
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        @media (max-width: 995px) {
            body { padding: 10px; }
        }
        .game-wrapper {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
        }
        .main-area {
            flex: 1 1 400px;
            max-width: 100%;
        }
        .title {
            font-size: 3em;
            font-weight: 700;
            margin-bottom: 30px;
            text-shadow: 0 0 30px rgba(0, 255, 200, 0.3);
            color: #00ffcc;
        }
        .dice-area {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 30px;
        }
        .dice-grid {
            display: flex;
            flex-wrap: nowrap;
            gap: 8px;
            justify-content: space-between;
            margin-bottom: 20px;
            width: 100%;
        }
        .dice-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
            font-size: min(3.1vw, 22px);
        }
        .die-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .keep-btn {
            padding: 6px 12px;
            font-size: 12px;
            font-weight: bold;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 0;
            width: 100%;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .keep-btn:hover {
            border-color: rgba(0, 255, 200, 0.6);
            background: rgba(0, 255, 200, 0.1);
        }
        .keep-btn.active-keep {
            border-color: #00ff00;
            background: rgba(0, 255, 0, 0.2);
            color: #00ff00;
            font-weight: bold;
        }
        .keep-btn.active-reroll {
            border-color: #ff4444;
            background: rgba(255, 68, 68, 0.2);
            color: #ff4444;
            font-weight: bold;
        }
        .die-container {
            width: 5em;
            height: 5em;
            position: relative;
            perspective: 1000px;
            transition: transform 0.3s ease;
        }
        .die-container.locked {
            transform: translateY(-15px);
        }
        .die {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .die-face {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.98), rgba(240,240,240,0.9));
            border: 2px solid rgba(200,200,200,0.5);
            border-radius: 0.8em;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 0.4em;
            backface-visibility: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.05);
        }
        .die-face .dot { margin: auto; box-shadow: inset 0 1px 3px rgba(0,0,0,0.5); }
        .face-1 { transform: rotateY(0deg) translateZ(2.5em); }
        .face-6 { transform: rotateY(180deg) translateZ(2.5em); }
        .face-2 { transform: rotateX(90deg) translateZ(2.5em); }
        .face-5 { transform: rotateX(-90deg) translateZ(2.5em); }
        .face-3 { transform: rotateY(90deg) translateZ(2.5em); }
        .face-4 { transform: rotateY(-90deg) translateZ(2.5em); }
        .die.rolling { animation: roll3d 1.5s linear infinite; }
        @keyframes roll3d {
            0% { transform: rotateX(0) rotateY(0) rotateZ(0); }
            100% { transform: rotateX(720deg) rotateY(360deg) rotateZ(360deg); }
        }
        .dot { width: 0.9em; height: 0.9em; background: #333; border-radius: 50%; transition: all 0.2s; }
        .dot.hidden { opacity: 0; }
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 10px;
            margin-bottom: 30px;
        }
        .btn {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(102, 126, 234, 0.6);
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .info-bar {
            background: rgba(0, 255, 204, 0.1);
            border: 2px solid #00ffcc;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            font-size: 1.2em;
            color: #00ffcc;
            font-weight: bold;
        }
        .rolls-remaining { font-size: 1.5em; margin-bottom: 15px; }
        .scorecard-area {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            flex: 1 1 350px;
            max-width: 100%;
            margin: 0 auto;
        }
        @media (max-width: 995px) {
            .game-wrapper { gap: 24px; }
            .main-area { max-width: 480px; }
            .scorecard-area { max-width: 450px; }
            .dice-area { padding: 20px 12px; }
            .dice-grid { flex-wrap: wrap; justify-content: center; gap: 8px; width: 100%; }
            .dice-item { width: auto; flex: 0 0 30%; font-size: min(6vw, 22px); }
            .keep-btn { width: 100%; font-size: 11px; padding: 6px 0; }
        }
        @media (max-width: 480px) {
            .game-wrapper { gap: 16px; }
            .dice-area { padding: 16px 10px; }
            .scorecard-area { padding: 20px 12px; }
        }
        .scorecard-title {
            font-size: 1.8em;
            font-weight: 700;
            margin-bottom: 25px;
            color: #00ffcc;
            text-align: center;
        }
        .score-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            margin: 8px 0;
            font-size: 1.05em;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
            position: relative;
        }
        .score-item:hover:not(.filled):not(.bonus) {
            background: rgba(102, 126, 234, 0.3);
            border-left-color: #667eea;
            transform: translateX(5px);
        }
        .score-item.filled { background: rgba(0, 255, 204, 0.15); cursor: default; border-left-color: #00ffcc; }
        .score-item.bonus { background: rgba(255, 215, 0, 0.15); border-left-color: #ffd700; font-weight: bold; cursor: default; }
        .score-name { font-weight: 500; font-size: 1.05em; flex: 1; }
        .score-val { font-weight: bold; color: #ffd700; font-size: 1.1em; min-width: 60px; text-align: right; }
        .score-preview { font-size: 0.85em; color: #00ffcc; margin-left: 10px; opacity: 0.8; }
        
        .total-score {
            margin-top: 20px; padding-top: 20px; border-top: 2px solid rgba(255, 255, 255, 0.2);
            display: flex; justify-content: space-between; font-size: 1.3em; font-weight: bold; color: #ffd700;
        }
        .ai-breakdown {
            margin-top: 15px; background: rgba(0, 0, 0, 0.3); border-radius: 10px;
            padding: 12px; font-size: 0.9em; text-align: left;
        }
        .ai-mode-row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:10px 0 0; }
        .ai-mode-btn {
            border:1px solid rgba(255,255,255,0.18); background:rgba(255,255,255,0.06); color:#dbe4ee;
            border-radius:999px; padding:7px 14px; font-size:0.85rem; font-weight:700; cursor:pointer; transition:0.2s ease;
        }
        .ai-mode-btn.active { background:#59f0c2; color:#07251d; border-color:#59f0c2; }
        .ai-panel-head { display:flex; justify-content:space-between; gap:10px; align-items:center; margin-bottom:10px; }
        .ai-panel-title { font-weight:800; color:#f4f7fb; }
        .ai-summary-line { margin-bottom:10px; color:#9ab0c2; line-height:1.4; font-size:0.9em; }
        .ai-perspective { color:#59f0c2; font-size:0.8em; font-weight:700; }
        .ai-reason { margin-top:6px; color:#76dcb6; font-size:0.84em; }
        .winprob-panel {
            margin-top: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px; padding: 14px;
        }
        .winprob-head { display:flex; justify-content:space-between; align-items:flex-end; gap:10px; margin-bottom:10px; }
        .winprob-title { color:#f4f7fb; font-weight:800; }
        .winprob-sub { color:#93a3b8; font-size:0.8em; }
        .winprob-bar { display:flex; width:100%; height:30px; border-radius:999px; overflow:hidden; background:rgba(255,255,255,0.06); margin-bottom:8px; }
        .winprob-left, .winprob-right { display:flex; align-items:center; white-space:nowrap; font-size:0.82em; font-weight:800; }
        .winprob-left { justify-content:flex-start; background:#59f0c2; color:#06231b; padding-left:10px; }
        .winprob-right { justify-content:flex-end; background:#ff9f6e; color:#2b1307; padding-right:10px; }
        .winprob-meta { color:#93a3b8; font-size:0.82em; margin-bottom:8px; }
        .winprob-graph { width:100%; height:96px; display:block; }
        .observer-banner {
            background: linear-gradient(135deg, rgba(255, 214, 102, 0.18), rgba(255, 160, 90, 0.12));
            border: 1px solid rgba(255, 214, 102, 0.28);
            color: #ffe7a1;
            padding: 14px;
            border-radius: 14px;
            margin-bottom: 20px;
        }
        .observer-banner-head {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: flex-start;
            margin-bottom: 12px;
        }
        .observer-banner-title { font-size: 1.05rem; font-weight: 800; color: #fff2bf; }
        .observer-banner-sub { font-size: 0.84rem; color: #ffd98b; margin-top: 2px; }
        .observer-link-btn {
            border: 1px solid rgba(255,255,255,0.18);
            background: rgba(255,255,255,0.08);
            color: #fff4cf;
            border-radius: 999px;
            padding: 8px 12px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
            white-space: nowrap;
        }
        .observer-link-btn:hover { background: rgba(255,255,255,0.14); }
        .observer-meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
        }
        .observer-meta-card {
            min-width: 0;
            background: rgba(7, 10, 20, 0.26);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 10px 12px;
        }
        .observer-meta-label {
            color: #c2cbe0;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 6px;
        }
        .observer-meta-value {
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .breakdown-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); gap: 10px;
        }
        .breakdown-item:last-child { border-bottom: none; }
        .breakdown-val { color: #00ffcc; font-weight: bold; }
        .toast-overlay {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
            background: rgba(20, 20, 40, 0.95); color: #fff; padding: 30px 50px;
            border-radius: 20px; font-size: 2em; font-weight: 800; text-align: center;
            z-index: 2000; pointer-events: none; opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid #00ffcc; box-shadow: 0 0 50px rgba(0, 255, 204, 0.4);
            display: flex; flex-direction: column; gap: 10px;
        }
        .toast-overlay.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .toast-cat { font-size: 0.6em; color: #aaa; text-transform: uppercase; letter-spacing: 2px; }
        .toast-score { font-size: 1.5em; color: #ffd700; text-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
        @media (max-width: 767px) {
            .toast-overlay { padding: 20px 30px; font-size: 1.3em; border-radius: 15px; max-width: 85%; }
            body { padding: 6px; }
            .game-wrapper { width: 100%; max-width: 100%; padding: 0; margin: 0; }
            .main-area { max-width: 100%; }
            .dice-area { width: 100%; max-width: 100%; margin: 0 auto; padding: 16px 2px; }
            .dice-grid { flex-wrap: wrap; justify-content: center; gap: 8px; width: 100%; max-width: none; margin: 0; padding: 0; }
            .dice-item { width: auto; flex: 0 0 30%; font-size: min(6vw, 22px); }
            .keep-btn { width: 100%; font-size: 11px; padding: 6px 0; }
        }
        @media (max-width: 768px) {
            .game-wrapper { display: block !important; max-width: 100% !important; margin: 0 !important; }
            .main-area, .scorecard-area { width: 100% !important; max-width: 100% !important; flex: none !important; }
            .title { font-size: 2rem !important; margin-bottom: 16px !important; text-align: center; }
            .dice-area { padding: 16px 10px !important; border-radius: 18px !important; margin-bottom: 16px !important; }
            .scorecard-area { padding: 16px 10px !important; border-radius: 18px !important; }
            .controls { flex-wrap: wrap; gap: 10px !important; margin-bottom: 18px !important; }
            .controls .btn { flex: 1 1 calc(50% - 6px); min-width: 130px; padding: 11px 14px !important; font-size: 0.98rem !important; }
            .rolls-remaining { font-size: 1.2rem; }
            .score-item { padding: 11px 10px; font-size: 0.95em; }
            .observer-banner-head { flex-direction: column; align-items: stretch; }
            .observer-link-btn { width: 100%; }
            .observer-meta-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="main-area">
            <div class="title">🎲 YACHT <span id="room-label" style="font-size:0.4em; color:#fff; opacity:0.8; margin-left:12px;"></span></div>
            <div id="observer-banner" class="observer-banner" style="display:none;">
                <div class="observer-banner-head">
                    <div>
                        <div class="observer-banner-title">👁️ 관전 중</div>
                        <div class="observer-banner-sub">실시간으로 경기 상황을 읽기 전용으로 보고 있습니다.</div>
                    </div>
                    <button type="button" class="observer-link-btn" data-copy-observer-link onclick="copyObserverLink()">🔗 관전 링크 복사</button>
                </div>
                <div id="observer-summary-grid" class="observer-meta-grid"></div>
            </div>
            <div class="dice-area">
                <div class="dice-grid" id="dice-grid"></div>
                <div class="info-bar">
                    <div id="timer-bar" style="font-size:1.1em; color:#ff6b6b; margin:2px 0 0 0; font-weight:bold; display:none; line-height:2;">⏳<span id="timer-count">30</span>초 남았습니다</div>
                    <div class="rolls-remaining">남은 Roll: <span id="rolls-left">3</span>/3</div>
                    <div id="game-status" style="margin-top: 10px; color: #00ffcc; font-size: 0.9em; text-align: center; min-height: 24px;"></div>
                    <div id="turn-progress" style="margin-top: 6px; color: #b8fff0; font-size: 0.85em; text-align: center;">턴 진행: 대기 중 (0/24)</div>
                    <div id="ai-breakdown" class="ai-breakdown"></div>
                    <div class="ai-mode-row" id="ai-mode-row">
                        <button class="ai-mode-btn" data-ai-mode="safe">안전형</button>
                        <button class="ai-mode-btn" data-ai-mode="aggressive">한방형</button>
                    </div>
                    <div id="ai-info-tip" style="margin-top: 8px; padding: 8px 12px; background: rgba(0, 255, 204, 0.1); border-left: 3px solid #00ffcc; border-radius: 5px; font-size: 0.75em; color: #aaa; line-height: 1.4; display: none;">
                        💡 굴림 단계에서는 고득점 족보와 Upper Bonus 흐름을 함께 보고, 점수 기록 단계에서는 희생 칸까지 포함해 이번 턴 정리 순서를 제안합니다.<br>Yacht는 기본 주추천보다 확률 정보에 가깝게 참고하도록 조정했습니다.
                    </div>
                    <div id="win-prob-panel" class="winprob-panel"></div>
                </div>
            </div>
            <div class="controls" id="player-controls">
                <button class="btn" onclick="rollDice()" id="roll-btn">🎲 ROLL</button>
                <button class="btn" style="background:linear-gradient(135deg, #ff6b6b 0%, #c92a2a 100%); box-shadow:0 4px 15px rgba(255,107,107,0.4);" onclick="leaveRoom()">🚪 나가기</button>
            </div>
            <div class="controls" id="observer-controls" style="display:none;">
                <button class="btn" style="background:linear-gradient(135deg, #ffb347 0%, #ff7f50 100%); box-shadow:0 4px 15px rgba(255,179,71,0.35);" data-copy-observer-link onclick="copyObserverLink()">🔗 링크 복사</button>
                <button class="btn" style="background:linear-gradient(135deg, #ff6b6b 0%, #c92a2a 100%); box-shadow:0 4px 15px rgba(255,107,107,0.4);" onclick="leaveRoom()">🚪 나가기</button>
            </div>
            
            <div class="controls" style="margin-top:10px;" id="multiplayer-controls">
                <button class="btn" style="background:linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%); box-shadow:0 4px 15px rgba(78,205,196,0.4); display:none;" id="pass-turn-btn" onclick="passTurn()">🔁 선공권 넘기기</button>
            </div>
        </div>

        <div class="scorecard-area">
            <div id="scorecard"></div>
        </div>
    </div>

    <div id="score-toast" class="toast-overlay"></div>
    <script src="{{ url_for('static', filename='js/dom_utils.js', v='20260406-5') }}"></script>
    <script src="{{ url_for('static', filename='js/game_state.js', v='20260406-5') }}"></script>
    <script src="{{ url_for('static', filename='js/score_utils.js', v='20260407-1') }}"></script>
    <script src="{{ url_for('static', filename='js/ai_panel.js', v='20260407-1') }}"></script>
    <script src="{{ url_for('static', filename='js/winprob.js', v='20260406-5') }}"></script>
    <script src="{{ url_for('static', filename='js/yacht_game.js', v='20260406-5') }}"></script>
    <script>
        // --- [전역 변수 설정] ---
        // 멀티플레이 전용이므로 관련 변수를 간소화합니다.
        const params = new URLSearchParams(window.location.search);
        let roomCode = params.get('room') || localStorage.getItem('yacht_room') || '';
        const roomTokenKey = (code) => `yacht_player_token_${code}`;
        
        // 방 정보가 없으면 즉시 퇴장
        if (!roomCode) {
            alert('잘못된 접근입니다. 로비에서 방을 생성하거나 참가해주세요.');
            window.location.href = '/';
        } else {
            localStorage.setItem('yacht_room', roomCode);
        }

        let username = localStorage.getItem('yacht_username') || '';
        var isObserver = false;
        // 관전 모드 진입: ?mode=observer 파라미터가 있으면 관전자
        if (params.get('mode') === 'observer') {
            isObserver = true;
            username = username || 'observer_' + Math.floor(Math.random()*10000);
            localStorage.setItem('yacht_username', username);
        }
        if (!username) {
            alert('닉네임 정보가 없습니다. 로비에서 다시 입장해주세요.');
            window.location.href = '/';
        }
        let playerToken = isObserver ? '' : localStorage.getItem(roomTokenKey(roomCode));
        if (!isObserver && !playerToken) {
            alert('플레이어 인증 정보가 없습니다. 로비에서 다시 입장해주세요.');
            window.location.href = '/';
        }
        // --- [관전자 입장 처리] ---
        async function tryObserveRoom() {
            if (!roomCode || !isObserver) return;
            try {
                const res = await fetch(`/api/rooms/${roomCode}/observe`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });
                if (!res.ok) {
                    alert('관전 입장에 실패했습니다.');
                    window.location.href = '/';
                    return;
                }
                const data = await res.json();
                observerCount = Number(data.observers?.length || 0);
                if (Array.isArray(data.players)) roomPlayers = data.players;
                renderObserverSummary();
            } catch (e) {
                alert('관전 입장 중 오류 발생.');
                window.location.href = '/';
            }
        }
        // --- [관전자 UI 처리] ---
        function updateObserverUI() {
            if (isObserver) {

        let roomVersion = 0;

        const ROOM_REQUEST_TIMEOUT_HIDDEN_MS = 12000;

        function isPageHidden() {
            return document.visibilityState === 'hidden';
        }

        function currentRoomRequestTimeoutMs() {
            return isPageHidden() ? ROOM_REQUEST_TIMEOUT_HIDDEN_MS : ROOM_REQUEST_TIMEOUT_VISIBLE_MS;
        }

        function currentSyncIntervalMs() {
            return isPageHidden() ? ROOM_SYNC_INTERVAL_HIDDEN_MS : ROOM_SYNC_INTERVAL_VISIBLE_MS;
        }

        function markRoomContact() {
            lastRoomContactAt = Date.now();
            syncFailures = 0;
        }

        function hasRoomTimedOutLocally() {
            return (Date.now() - lastRoomContactAt) > ROOM_CONTACT_GRACE_MS;
        }

        async function fetchWithTimeout(url, options = {}, timeoutMs = currentRoomRequestTimeoutMs()) {
            if (typeof AbortController !== 'function') {
                return fetch(url, options);
            }
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
                return await fetch(url, {...options, signal: controller.signal});
            } finally {
                clearTimeout(timer);
            }
        }

        function hasRecordedScore(card) {
            return Array.isArray(card) && card.some((value) => value !== null && value !== undefined);
        }

        function getScoreSummaryText(myTotal, oppTotal) {
            if (isObserver) {
                const leftName = roomPlayers[0] || 'Player 1';
                const rightName = roomPlayers[1] || opponentName || endLoser || 'Player 2';
                return `${leftName} ${myTotal} : ${rightName} ${oppTotal}`;
            }
            return `나 ${myTotal} : 상대 ${oppTotal}`;
        }

            if (endReason === 'leave' && endWinner && endLoser) {

                    detail = `${endLoser}님 퇴장, ${endWinner}님 승리`;
                    status = `🚪 ${endLoser}님 퇴장으로 게임이 종료되었습니다`;

        function shouldWarnBeforeLeave() {
            if (allowImmediateExit || isObserver || gameOver) return false;
            if (roomPlayers.length < 2) return false;
            return rollsLeft < 3 || hasRecordedScore(GameState.getMyCard()) || hasRecordedScore(GameState.getOppCard());

        // --- [타이머 로직] (양쪽 플레이어 시간 표시) ---
        function timeOut(){
            const toast = document.getElementById('score-toast');
            toast.innerHTML = `<div class="toast-cat">⏰ 시간 초과!</div><div class="toast-score">자동으로 진행합니다...</div>`;
            toast.classList.add('show');
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const now = audioContext.currentTime;
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.frequency.value = 1000;
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } catch (e) { console.warn('Toast audio failed:', e); }
            setTimeout(() => toast.classList.remove('show'), 1500);
        }

        let timerInterval = null;
        let turnLeftSeconds = null;

        function updateTurnTimer() {
            if (turnLeftSeconds == null || gameOver || rollsLeft === 0) {
                document.getElementById('timer-bar').style.display = 'none';
                return;
            }
            const timerBar = document.getElementById('timer-bar');
            timerBar.style.display = 'block';

            if (isObserver) {

            } else if (isMyTurn()) {

        function startTurnTimer() {
            if (timerInterval) return;

            // 시간 정보가 있고 게임 중이면 무조건 표시
            if (turnLeftSeconds != null && !gameOver && rollsLeft > 0) {
                updateTurnTimer();
                timerInterval = setInterval(() => {
                    if (turnLeftSeconds > 0) {
                        turnLeftSeconds--;
                    }
                    updateTurnTimer();
                    
                    if (turnLeftSeconds <= 0 && isMyTurn() && !gameOver && !isRolling) {
                        clearTurnTimer();
                        timeOut();
                        if (rollsLeft > 0) {
                            rollDice();
                        } else {
                            const available = myCard.map((v, i) => v === null ? i : null).filter(v => v !== null);
                            if (available.length > 0) pickCategory(available[0]);
                        }
                    }
                }, 1000);
            } else {
                document.getElementById('timer-bar').style.display = 'none';
            }
        }

        function clearTurnTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            document.getElementById('timer-bar').style.display = 'none';
        }

        function showStatusToast(title, detail = '', timeoutMs = 1800) {
            const toast = document.getElementById('score-toast');
            const detailHtml = detail ? `<div class="toast-score" style="font-size:0.9em;">${escapeHtml(detail)}</div>` : '';
            toast.innerHTML = `<div class="toast-cat">${escapeHtml(title)}</div>${detailHtml}`;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), timeoutMs);
        }

        function stopSyncPolling() {
            if (syncTimer) {
                clearInterval(syncTimer);
                syncTimer = null;
            }
        }

        function startSyncPolling(options = {}) {
            const {immediate = false} = options;
            stopSyncPolling();
            syncTimer = setInterval(fetchRoomState, currentSyncIntervalMs());
            if (immediate) {
                fetchRoomState();
            }
        }

        function stopRoomHeartbeat() {
            if (roomHeartbeatTimer) {
                clearInterval(roomHeartbeatTimer);
                roomHeartbeatTimer = null;
            }
        }

        function startRoomHeartbeat(options = {}) {
            const {immediate = false} = options;
            if (roomHeartbeatTimer) return;
            if (immediate) {
                sendRoomHeartbeat({immediate: true});
            }
            roomHeartbeatTimer = setInterval(() => {
                sendRoomHeartbeat();
            }, ROOM_HEARTBEAT_INTERVAL_MS);
        }

        function handleConnectionLost(msg = '상대방과의 연결이 끊어졌습니다. 로비로 이동합니다.') {
            if (connectionLostHandled) return;
            connectionLostHandled = true;
            allowImmediateExit = true;
            clearTurnTimer();
            stopSyncPolling();
            stopRoomHeartbeat();
            localStorage.removeItem('yacht_room');
            showStatusToast('연결 종료', msg, 1500);
            setTimeout(() => window.location.replace('/'), 1500);
        }

        window.addEventListener('offline', () => {
            showStatusToast('네트워크 불안정', '재연결을 시도하고 있습니다.', 1400);
        });

        window.addEventListener('online', () => {
            if (connectionLostHandled) return;
            startSyncPolling({immediate: true});
            sendRoomHeartbeat({immediate: true});
            showStatusToast('연결 복구', '방 상태를 다시 확인하고 있습니다.', 1400);
        });

        document.addEventListener('visibilitychange', () => {
            if (connectionLostHandled || !roomCode) return;
            startSyncPolling({immediate: document.visibilityState === 'visible'});
            if (document.visibilityState === 'visible') {
                sendRoomHeartbeat({immediate: true});
            }
        });

        function showGameOverToast(myTotal, oppTotal) {
            if (gameOverToastShown) return;
            const toast = document.getElementById('score-toast');
            const {title, detail} = getGameOverPresentation(myTotal, oppTotal);
            
            toast.innerHTML = `<div class="toast-cat">${title}</div><div class="toast-score">${detail}</div>`;
            toast.classList.add('show');
            playTurnToastSound();
            gameOverToastShown = true;
            setTimeout(() => toast.classList.remove('show'), 2800);
        }

        const isMyTurn = () => {
            if (!turnOwner) return false;
            return turnOwner === username;
        };

        // --- [서버 동기화] ---
        async function fetchRoomState() {
            if (!roomCode || syncRequestInFlight || connectionLostHandled) return;
            syncRequestInFlight = true;
            const qs = new URLSearchParams();
            qs.set('u', username);
            if (!isObserver && playerToken) qs.set('pt', playerToken);
            try {
                const r = await fetchWithTimeout(
                    `/api/rooms/${roomCode}?${qs.toString()}`,
                    {cache: 'no-store'},
                    currentRoomRequestTimeoutMs(),
                );
                if (r.status === 404) {
                    handleConnectionLost('방 정보를 찾을 수 없습니다. 로비로 이동합니다.');
                    return;
                }
                if (r.status === 403) {
                    handleConnectionLost('참가 인증이 만료되었습니다. 로비에서 다시 입장해 주세요.');
                    return;
                }

                const data = await r.json();
                if (!r.ok) {
                    throw new Error(data.error || `HTTP ${r.status}`);
                }

                markRoomContact();
                observerCount = Number(data.observer_count ?? (Array.isArray(data.observers) ? data.observers.length : observerCount));
                roomPhase = data.room_phase || roomPhase;
                if (data.players) {
                    roomPlayers = data.players;
                    if (!isObserver && !roomPlayers.includes(username)) {
                        handleConnectionLost('현재 방 참가자 목록에서 제외되었습니다. 로비로 이동합니다.');
                        return;
                    }
                    const opp = roomPlayers.find(p => p !== username);
                    if (opp && opp !== opponentName) {
                        opponentName = opp;
                    }
                }
                updateObserverUI();
                if (data.state) {
                    turnLeftSeconds = data.state.turn_left_seconds != null ? data.state.turn_left_seconds : null;
                    applyRemoteState(data.state);
                }
            } catch (e) {
                console.warn('pull failed', e);
                syncFailures++;
                if (hasRoomTimedOutLocally()) {
                    handleConnectionLost('연결 상태를 오래 확인할 수 없어 로비로 이동합니다.');
                }
            } finally {
                syncRequestInFlight = false;
            }
        }

        async function sendRoomHeartbeat(options = {}) {
            const {immediate = false} = options;
            if (!roomCode || !username || connectionLostHandled) return;
            if (heartbeatRequestInFlight && !immediate) return;
            heartbeatRequestInFlight = true;
            try {
                const r = await fetchWithTimeout(
                    `/api/rooms/${roomCode}/heartbeat`,
                    {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        cache: 'no-store',
                        body: JSON.stringify({
                            username,
                            player_token: isObserver ? undefined : playerToken,
                        }),
                    },
                    immediate ? 4000 : currentRoomRequestTimeoutMs(),
                );
                if (r.status === 404) {
                    handleConnectionLost('방 연결이 종료되었습니다. 로비로 이동합니다.');
                    return;
                }
                if (r.status === 403) {
                    handleConnectionLost('참가 인증이 만료되었습니다. 로비에서 다시 입장해 주세요.');
                    return;
                }

                const data = await r.json();
                if (!r.ok) {
                    throw new Error(data.error || `HTTP ${r.status}`);
                }

                markRoomContact();
                observerCount = Number(data.observer_count ?? observerCount);
                roomPhase = data.room_phase || roomPhase;
                renderObserverSummary();
            } catch (e) {
                console.warn('heartbeat failed', e);
                if (hasRoomTimedOutLocally()) {
                    handleConnectionLost('방 연결이 오래 끊겨 로비로 이동합니다.');
                }
            } finally {
                heartbeatRequestInFlight = false;
            }
        }

        function refreshTurnUI() {
            const statusEl = document.getElementById('game-status');
            if (!statusEl) return;
            updateTurnProgressUI();

            const passBtn = document.getElementById('pass-turn-btn');
            if (GameState.isGameOver()) {
                const myTotal = calcTotals(GameState.getMyCard()).total;
                const oppTotal = calcTotals(GameState.getOppCard()).total;
                statusEl.innerText = getGameOverPresentation(myTotal, oppTotal).status;
                clearTurnTimer();
                if (passBtn) passBtn.style.display = 'none';
                updateDice();
                return;
            }

            // 타이머 일시정지 로직을 위한 변수
            let timerPaused = false; 

            if (isObserver) {
                // [수정됨] 관전자: 현재 턴 주인의 이름을 표시
                const currentTurnName = turnOwner || '플레이어';
                statusEl.innerText = `🎲 ${currentTurnName} 님의 턴입니다`;
                // 관전자는 선공권 넘기기 버튼 숨김
                if(passBtn) passBtn.style.display = 'none';
            } else {
                // [플레이어] 기존 로직 유지
                if (!opponentName || roomPlayers.length < 2) {
                    statusEl.innerText = '⏳ 상대방 입장 대기 중...';
                } else if (!isMyTurn()) {
                    statusEl.innerText = '⏸️ 상대 턴입니다';
                } else {
                    statusEl.innerText = '🎲 주사위를 돌려주세요';
                }

                // 선공권 넘기기 버튼 로직
                if (passBtn) {
                    const myEmpty = GameState.getMyCard().every(v => v === null);
                    const oppEmpty = GameState.getOppCard().every(v => v === null);
                    if (myEmpty && oppEmpty && rollsLeft === 3 && !gameOver && opponentName && roomPlayers.length >= 2) {
                        timerPaused = true;
                    }
                    const canPass = isMyTurn() && timerPaused;
                    passBtn.style.display = canPass ? 'inline-flex' : 'none';
                }
            }

            updateDice();
            // timerPaused 변수 적용
            if (turnLeftSeconds != null && !gameOver && !timerPaused) {
                startTurnTimer();
            } else {
                clearTurnTimer();
            }
        }

        function updateDice() {
            const transforms = {
                1: 'rotateX(0deg) rotateY(0deg)',
                6: 'rotateX(180deg) rotateY(0deg)',
                2: 'rotateX(-90deg) rotateY(0deg)',
                5: 'rotateX(90deg) rotateY(0deg)',
                3: 'rotateY(-90deg) rotateX(0deg)',
                4: 'rotateY(90deg) rotateX(0deg)'
            };
            
            for (let i = 0; i < 5; i++) {
                const d = document.getElementById(`die-${i}`);
                const c = document.getElementById(`die-container-${i}`);
                if (!d) continue;
                
                if (rollsLeft === 3 && !gameOver) {
                    d.classList.add('rolling');
                } else {
                    d.classList.remove('rolling');
                }

                if (GameState.getKept()[i]) {
                    c.classList.add('locked');
                    d.querySelectorAll('.die-face').forEach(f => f.style.borderColor = '#00ffcc');
                } else {
                    c.classList.remove('locked');
                    d.querySelectorAll('.die-face').forEach(f => f.style.borderColor = 'rgba(200,200,200,0.5)');
                }
                
                const val = GameState.getDice()[i] || 1; 
                d.style.transform = transforms[val];
                
                const keepBtn = document.getElementById(`keep-${i}`);
                const keepText = document.getElementById(`keep-text-${i}`);
                if (keepBtn && keepText) {
                    keepBtn.className = 'keep-btn';
                    
                    if (rollsLeft >= 3 || rollsLeft === 0 || gameOver || isRolling || !isMyTurn()) {
                        keepBtn.disabled = true;
                        keepBtn.style.opacity = '0.5';
                        keepBtn.style.cursor = 'not-allowed';
                    } else {
                        keepBtn.disabled = false;
                        keepBtn.style.opacity = '1';
                        keepBtn.style.cursor = 'pointer';
                    }
                    
                    if (kept[i]) {
                        keepBtn.classList.add('active-keep');
                        keepBtn.style.borderColor = '#00ff00';
                    } else {
                        keepBtn.style.borderColor = 'rgba(255, 255, 255, 0.3)';
                    }

                    let aiInfo = '';
                    keepBtn.style.boxShadow = 'none';

                    if (aiRec?.dice_recommendations) {
                        const r = aiRec.dice_recommendations[i];
                        if (r && r.action === 'keep' && !kept[i]) {
                            keepBtn.style.borderColor = '#00ffcc';
                            keepBtn.style.boxShadow = '0 0 10px rgba(0, 255, 204, 0.8)';
                        }
                    }
                    keepText.innerHTML = (kept[i] ? '✓ KEEP' : 'KEEP') + aiInfo;
                }
                const lbl = document.getElementById(`lock-${i}`);
                if (lbl) lbl.innerText = '';
            }
            document.getElementById('rolls-left').innerText = GameState.getRollsLeft();
            const waitingForOpponent = !opponentName || roomPlayers.length < 2;
            document.getElementById('roll-btn').disabled = GameState.getRollsLeft() <= 0 || GameState.isGameOver() || isRolling || !isMyTurn() || waitingForOpponent;
        }

        function toggleLock(i) {
            if (isObserver || rollsLeft === 3 || gameOver || !isMyTurn()) return;
            kept[i] = kept[i] ? 0 : 1;
            GameState.setKept(kept);
            updateDice();
            pushState();
            playKeepSound();
        }

        function refreshInsightPanels() {
            const aiPerspective = isObserver ? `${turnOwner || '플레이어'} 턴 기준` : (isMyTurn() ? '내 턴 기준' : '상대 턴 기준');
            renderAiPanel('ai-breakdown', GameState.getAiRec(), { perspective: aiPerspective });

            const leftLabel = isObserver ? (roomPlayers[0] || 'Player 1') : '나';
            const rightLabel = isObserver ? (roomPlayers[1] || 'Player 2') : (opponentName || '상대');
            const snapshot = estimateWinChances(
                GameState.getMyCard(),
                GameState.getOppCard(),
                {
                    myDice: turnOwner === username || (isObserver && turnOwner === roomPlayers[0]) ? dice : null,
                    myRollsLeft: turnOwner === username || (isObserver && turnOwner === roomPlayers[0]) ? GameState.getRollsLeft() : 3,
                    oppDice: !isObserver && turnOwner === opponentName ? dice : (isObserver && turnOwner === roomPlayers[1] ? dice : null),
                    oppRollsLeft: !isObserver && turnOwner === opponentName ? GameState.getRollsLeft() : (isObserver && turnOwner === roomPlayers[1] ? GameState.getRollsLeft() : 3),
                }
            );
            matchWinHistory = recordWinChance(matchWinHistory, snapshot.myProbability);
            renderWinChancePanel('win-prob-panel', snapshot, {
                history: matchWinHistory,
                leftLabel,
                rightLabel,
            });
        }

        function buildStatePayload() {
            const scores = {};
            scores[username] = myCard;
            if (opponentName) scores[opponentName] = oppCard;
            
            return {
                username, dice, kept, rolls_left: rollsLeft, scores,
                turn: turnOwner || username,
                game_over: gameOver,
                ai_rec: aiRec,
                player_token: playerToken,
                winner: endWinner,
                loser: endLoser,
                end_reason: endReason,
            };
        }

        async function pushState() {
            if (!roomCode || !username || isApplyingRemote) return;
            try {
                const r = await fetchWithTimeout(
                    `/api/rooms/${roomCode}/sync`,
                    {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(buildStatePayload()),
                    },
                    currentRoomRequestTimeoutMs(),
                );
                const data = await r.json();
                if (r.status === 404) {
                    handleConnectionLost('방 연결이 종료되었습니다. 로비로 이동합니다.');
                    return;
                }
                if (r.status === 403 && data.error === '참가자 인증 실패') {
                    handleConnectionLost('참가 인증이 만료되었습니다. 로비에서 다시 입장해 주세요.');
                    return;
                }
                if (!r.ok) {
                    throw new Error(data.error || `HTTP ${r.status}`);
                }
                markRoomContact();
                if (data.state && typeof data.state.version === 'number') {
                    roomVersion = data.state.version;
                }
            } catch (e) { console.warn('sync failed', e); }
        }

function applyRemoteState(state) {
    if (!state) return;
    if (typeof state.version === 'number' && state.version <= roomVersion) return;
    isApplyingRemote = true;
    roomVersion = state.version || roomVersion;
    
    const prevTurnOwner = turnOwner;
    const playerDice = state.player_dice || {};
    const playerKept = state.player_kept || {};
    const playerRollsLeft = state.player_rolls_left || {};

    // 1. 관전자 모드일 때 플레이어 식별 (방장 vs 참가자)
    let p1Name = roomPlayers[0]; // 보통 방장
    let p2Name = roomPlayers[1]; // 참가자
    endWinner = state.winner || null;
    endLoser = state.loser || null;
    endReason = state.end_reason || null;

    // 2. 현재 턴 주인의 주사위 상태 가져오기
    const currentTurnOwner = state.turn;
    const fallbackDice = [1,1,1,1,1];
    const fallbackKept = [0,0,0,0,0];

    let diceToShow = [1,1,1,1,1];
    let keptToShow = [0,0,0,0,0];
    let rollsToShow = 3;

    if (currentTurnOwner && playerDice[currentTurnOwner]) {
        diceToShow = playerDice[currentTurnOwner] || fallbackDice;
        keptToShow = playerKept[currentTurnOwner] || fallbackKept;
        rollsToShow = playerRollsLeft[currentTurnOwner] ?? 3;
    }

    GameState.setDice(diceToShow);
    GameState.setKept(keptToShow);
    GameState.setRollsLeft(rollsToShow);
    GameState.setGameOver(state.game_over ?? GameState.isGameOver());
    if (state.game_over) roomPhase = 'finished';
    
    // 3. 플레이어 목록 업데이트
    const newPlayers = state.players || [];
    roomPlayers = newPlayers;
    
    // 상대방 이름 업데이트 (플레이어 입장에서)
    if (!isObserver && !opponentName && roomPlayers.length > 1) {
        const opp = roomPlayers.find(p => p !== username);
        if (opp) opponentName = opp;
    }
    
    if (state.turn) turnOwner = state.turn;
    
    const scores = state.scores || {};
    const scorePlayers = Object.keys(scores);
    
    // 4. 점수판 데이터 매핑 (가장 중요한 부분!)
    
    if (isObserver) {
        // [관전자 로직] 나/상대 개념 없이 P1(왼쪽), P2(오른쪽) 고정
        p1Name = roomPlayers[0] || scorePlayers[0] || endWinner || 'Player 1';
        p2Name = roomPlayers[1] || scorePlayers.find(name => name !== p1Name) || endLoser || 'Player 2';
        
        if (scores[p1Name]) GameState.setMyCard(scores[p1Name]);
        else GameState.setMyCard(Array(12).fill(null));

        if (scores[p2Name]) GameState.setOppCard(scores[p2Name]);
        else GameState.setOppCard(Array(12).fill(null));
        
    } else {
        // [플레이어 로직] 기존 유지 (내 점수 vs 상대 점수)
        if (scores[username]) GameState.setMyCard(scores[username]);
        
        const guessedOpp = Object.keys(scores).find(n => n !== username) || opponentName;
        if (guessedOpp && scores[guessedOpp]) {
            opponentName = guessedOpp;
            GameState.setOppCard(scores[guessedOpp]);
        }
    }
    
    // 5. AI 정보 및 기타 UI 업데이트
    GameState.setAiRec(state.ai_rec || null);
    updateLocalVars();
    
    // 내 턴 알림 (플레이어만)
    if (!isObserver && prevTurnOwner && prevTurnOwner !== username && turnOwner === username) {
        const toast = document.getElementById('score-toast');
        toast.innerHTML = `<div style="font-size:1.1em; font-weight:bold; color:#00ff00;">✨ 당신의 턴입니다!</div>`;
        toast.classList.add('show');
        playTurnToastSound();
        setTimeout(() => toast.classList.remove('show'), 1500);
    }
    
    refreshInsightPanels();
    renderObserverSummary();

    // 게임 종료 처리
    if (GameState.isGameOver()) {
        const myTotal = calcTotals(GameState.getMyCard()).total;
        const oppTotal = calcTotals(GameState.getOppCard()).total;
        showGameOverToast(myTotal, oppTotal);
    }
    
    refreshTurnUI();
    updateDice();
    updateScorecard(); // 여기서 이름표 업데이트
    isApplyingRemote = false;
}

        async function rollDice() {
            if (rollsLeft <= 0 || gameOver || isRolling || !isMyTurn()) return;
            if (!opponentName || roomPlayers.length < 2) {
                alert('상대방이 입장할 때까지 기다려주세요!');
                return;
            }
            clearTurnTimer();
            
            // Web Audio API 효과음
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const now = audioContext.currentTime;
                const duration = 0.4;
                const bufferSize = audioContext.sampleRate * duration;
                const noiseBuffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
                
                const noiseSource = audioContext.createBufferSource();
                noiseSource.buffer = noiseBuffer;
                const noiseGain = audioContext.createGain();
                noiseSource.connect(noiseGain);
                noiseGain.connect(audioContext.destination);
                noiseGain.gain.setValueAtTime(0.2, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, now + duration);
                
                const beatDuration = 0.08;
                for (let beat = 0; beat < 5; beat++) {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.type = 'square';
                    const freqRange = 1200 - (beat * 160);
                    osc.frequency.value = Math.max(freqRange, 400);
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    const startTime = now + (beat * 0.07);
                    gain.gain.setValueAtTime(0.12, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, startTime + beatDuration);
                    osc.start(startTime);
                    osc.stop(startTime + beatDuration);
                }
                noiseSource.start(now);
                noiseSource.stop(now + duration);
            } catch (e) { console.warn('Audio context failed:', e); }

            isRolling = true;
            aiRec = null; 
            GameState.setAiRec(null);
            renderAiStatus('ai-breakdown', '🎲 계산 중...');
            updateDice(); 

            for (let i = 0; i < 5; i++) {
                if (!kept[i]) document.getElementById(`die-${i}`).classList.add('rolling');
            }
            
            setTimeout(async () => {
                try {
                    // 멀티플레이: 항상 서버에서 주사위 굴림
                    const r = await fetchWithTimeout(
                        `/api/rooms/${roomCode}/roll`,
                        {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({username, kept, player_token: playerToken}),
                        },
                        currentRoomRequestTimeoutMs(),
                    );
                    const data = await r.json();
                    if (r.status === 404) {
                        handleConnectionLost('방 연결이 종료되었습니다. 로비로 이동합니다.');
                        isRolling = false;
                        return;
                    }
                    if (r.status === 403 && data.error === '참가자 인증 실패') {
                        handleConnectionLost('참가 인증이 만료되었습니다. 로비에서 다시 입장해 주세요.');
                        isRolling = false;
                        return;
                    }
                    if (!r.ok) {
                        throw new Error(data.error || `HTTP ${r.status}`);
                    }
                    if (data.dice && typeof data.rolls_left === 'number') {
                        markRoomContact();
                        dice = data.dice;
                        rollsLeft = data.rolls_left;
                        GameState.setDice(dice);
                        GameState.setKept(kept);
                        GameState.setRollsLeft(rollsLeft);
                        turnLeftSeconds = 30;
                    } else {
                        alert('주사위 굴림 실패');
                        isRolling = false;
                        return;
                    }
                    
                    isRolling = false;
                    updateDice();
                    updateScorecard();
                    refreshTurnUI();
                    
                    if (calcScore(dice, 11) === 50) {
                        const toast = document.getElementById('score-toast');
                        if (myCard[11] >= 50) {
                            toast.innerHTML = `<div class="toast-cat">🏆 YACHT BONUS 가능!</div><div class="toast-score" style="font-size:0.9em;">다른 칸에 점수 기록 시 +100점</div>`;
                        } else if (myCard[11] === 0) {
                            toast.innerHTML = `<div class="toast-cat" style="color:#ff6b6b;">😢 YACHT 성공이지만</div><div class="toast-score" style="color:#ff6b6b; font-size:0.85em;">Bonus 불가능 (0점 처리됨)</div>`;
                        } else {
                            toast.innerHTML = `<div class="toast-cat">🎲 YACHT 성공!</div><div class="toast-score">50점</div>`;
                        }
                        toast.classList.add('show');
                        playTurnToastSound();
                        setTimeout(() => toast.classList.remove('show'), 2000);
                    }
                    
                    await askAI();
                    pushState();
                } catch (e) {
                    console.error('Roll failed:', e);
                    isRolling = false;
                }
            }, 600);
        }

        async function askAI() {
            if (gameOver || !isMyTurn()) return;
            try {
                const open_categories = myCard.map((v, i) => v === null ? i : null).filter(v => v !== null);
                const r = await fetch('/api/recommend', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({dice, rolls_left: rollsLeft, scorecard: myCard, open_categories, strategy_mode: getAiMode()})
                });
                const payload = await r.json();
                if (!r.ok || payload.error) {
                    throw new Error(payload.error || 'AI 추천 요청 실패');
                }
                aiRec = payload;
                GameState.setAiRec(aiRec);
                refreshInsightPanels();
                updateDice();
            } catch (e) {
                console.error(e);
                renderAiStatus('ai-breakdown', `추천 실패: ${e.message || '잠시 후 다시 시도해 주세요.'}`, 'error');
            }
        }

function updateScorecard() {
    const el = document.getElementById('scorecard');
    if (!el) return;
    updateTurnProgressUI();

    const safeMyCard = Array.isArray(myCard) ? myCard : Array(12).fill(null);
    const safeOppCard = Array.isArray(oppCard) ? oppCard : Array(12).fill(null);

    if (isObserver) {
        // [관전자 모드]
        const p1 = (roomPlayers && roomPlayers[0]) ? roomPlayers[0] : 'Player 1';
        const p2 = (roomPlayers && roomPlayers[1]) ? roomPlayers[1] : 'Waiting...';

        // 1. 기본 렌더링 (일단 둘 다 기본 색상으로 그리기)
        const html1 = renderCard(safeMyCard, false, p1);
        const html2 = renderCard(safeOppCard, false, p2);

        // ID를 부여하여 영역을 확실히 구분
        el.innerHTML = `
        <div style="display:flex; gap:16px; flex-wrap:wrap;">
            <div id="p1-card" style="flex:1; min-width:280px;">${html1}</div>
            <div id="p2-card" style="flex:1; min-width:280px;">${html2}</div>
        </div>`;

        // 2. DOM 요소를 직접 찾아서 스타일 변경 (가장 안전한 방법)
        const p1Title = el.querySelector('#p1-card .scorecard-title');
        const p2Title = el.querySelector('#p2-card .scorecard-title');
        
        // 형광 초록 스타일
        const activeStyle = { 
            color: '#00ff00', 
            textShadow: '0 0 20px rgba(0, 255, 0, 0.8)', 
            fontWeight: 'bold' 
        };
        // 기본 스타일
        const defaultStyle = { 
            color: '#00ffcc', 
            textShadow: 'none', 
            fontWeight: 'bold' // 원래 폰트 굵기 유지
        };

        // 턴 주인에 따라 스타일 적용
        if (p1Title) Object.assign(p1Title.style, (turnOwner === p1) ? activeStyle : defaultStyle);
        if (p2Title) Object.assign(p2Title.style, (turnOwner === p2) ? activeStyle : defaultStyle);

    } else {
        // [플레이어 모드] - 기존 유지
        const oppLabel = opponentName || '상대 대기 중';
        el.innerHTML = `
        <div style="display:flex; gap:16px; flex-wrap:wrap;">
            <div style="flex:1; min-width:280px;">${renderCard(myCard, true, '나 (' + username + ')')}</div>
            <div style="flex:1; min-width:280px;">${renderCard(oppCard, false, '상대 (' + oppLabel + ')')}</div>
        </div>`;
    }
}

// 게임 중(게임오버 전)에 페이지를 떠나려 할 때 경고창 띄우기
window.addEventListener('beforeunload', (e) => {
    if (!shouldWarnBeforeLeave()) return;
    
    // 표준 방식: 사용자에게 확인 메시지 유도
    e.preventDefault();
    e.returnValue = '';
});

        function showToast(category, score) {
            const toast = document.getElementById('score-toast');
            toast.innerHTML = `<div class="toast-cat">${category}</div><div class="toast-score">+${score}</div>`;
            toast.classList.add('show');
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const now = audioContext.currentTime;
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.frequency.value = 1000;
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } catch (e) { console.warn('Toast audio failed:', e); }
            setTimeout(() => toast.classList.remove('show'), 1500);
        }

        function pickCategory(i) {
            if (!isMyTurn() || myCard[i] !== null || rollsLeft === 3 || gameOver) return;
            clearTurnTimer(); 
            let score = calcScore(dice, i);
            
            let yachtBonus = 0;
            if (calcScore(dice, 11) === 50 && myCard[11] >= 50 && i !== 11 && score > 0) {
                yachtBonus = 100;
                myCard[11] += yachtBonus;
            }
            
            myCard[i] = score;
            if (yachtBonus > 0) {
                showToast(`🏆 Yacht Bonus: ${CATS[i]} +${score}점, Yacht +100점`, score);
            } else {
                showToast(CATS[i], score);
            }
            
            dice = [1,1,1,1,1];
            kept = [0,0,0,0,0];
            rollsLeft = 3;
            turnLeftSeconds = 30;
            aiRec = null;

            if (opponentName) turnOwner = opponentName;

            const myDone = myCard.every(v => v !== null);
            const oppDone = opponentName ? oppCard.every(v => v !== null) : true;
            if (myDone && oppDone) {
                gameOver = true;
                const myTotal = calcTotals(myCard).total;
                const oppTotal = calcTotals(oppCard).total;
                endReason = 'score';
                if (myTotal > oppTotal) {
                    endWinner = username;
                    endLoser = opponentName || null;
                } else if (myTotal < oppTotal) {
                    endWinner = opponentName || null;
                    endLoser = username;
                } else {
                    endWinner = null;
                    endLoser = null;
                }
                const statusEl = document.getElementById('game-status');
                if (statusEl) statusEl.innerText = getGameOverPresentation(myTotal, oppTotal).status;

                showGameOverToast(myTotal, oppTotal);

                if (username) {
                    const p2 = opponentName || null;
                    saveGameResult(username, myTotal, p2, oppTotal || 0);
                }
            }

            GameState.setState({
                dice: [...dice],
                kept: [...kept],
                rollsLeft,
                myCard: [...myCard],
                oppCard: [...oppCard],
                gameOver,
                aiRec,
            });

            updateDice();
            updateScorecard();
            refreshInsightPanels();
            refreshTurnUI();
            pushState();
        }

        function saveGameResult(username, finalScore, player2 = null, score2 = 0) {
            fetch('/api/save-game', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    player1: username,
                    score1: finalScore,
                    player2,
                    score2
                })
            })
            .then(r => r.json())
            .then(data => {
                if (data.status === 'success') {
                    setTimeout(() => {
                        alert(`게임 종료!\n\n최종 점수: ${finalScore}점\n\n로비로 이동합니다.`);
                        window.location.replace('/');
                    }, 800);
                }
            })
            .catch(e => console.error('Failed to save game:', e));
        }

        async function leaveRoom() {
            if (!confirm('정말 나가시겠습니까?')) return;
            try {
                allowImmediateExit = true;
                stopSyncPolling();
                stopRoomHeartbeat();
                clearTurnTimer();
                const payload = JSON.stringify({username, player_token: playerToken});
                if (navigator.sendBeacon) {
                    const url = `/api/rooms/${roomCode}/leave?username=${encodeURIComponent(username)}&pt=${encodeURIComponent(playerToken || '')}`;
                    navigator.sendBeacon(url, payload);
                } else {
                    fetch(`/api/rooms/${roomCode}/leave`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: payload,
                        keepalive: true,
                        cache: 'no-store',
                    }).catch((e) => console.warn('leave failed (non-blocking)', e));
                }
                localStorage.removeItem('yacht_room');
                gameOverToastShown = true;
                showStatusToast('나가기 완료', '로비로 이동합니다.', 1000);
            } catch (e) {
                console.error('Leave failed', e);
                allowImmediateExit = false;
                showStatusToast('나가기 실패', '잠시 후 다시 시도해 주세요.', 1200);
                return;
            }
            setTimeout(() => { window.location.replace('/'); }, 1000);
        }

        function passTurn() {
            const myEmpty = GameState.getMyCard().every(v => v === null);
            const oppEmpty = GameState.getOppCard().every(v => v === null);
            if (!opponentName || !isMyTurn() || GameState.getRollsLeft() !== 3 || !myEmpty || !oppEmpty) return;
            
            turnOwner = opponentName;
            refreshTurnUI();
            updateDice();
            updateScorecard();
            pushState();
            
            const toast = document.getElementById('score-toast');
            toast.innerHTML = `<div style="font-size:0.8em;">선공권을 ${escapeHtml(opponentName)}님에게 넘겼습니다</div>`;
            toast.classList.add('show');
            playTurnToastSound();
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        async function initializeGame() {
            renderDice();
            updateScorecard();
            document.getElementById('ai-breakdown').innerHTML = '<div style="color:#999; text-align:center; padding:12px; font-size:0.9em;">🎲 주사위를 굴려주세요</div>';
            bindAiModeControls(() => {
                if (!isObserver && !gameOver && isMyTurn() && rollsLeft < 3) askAI();
            });
            const roomLabel = document.getElementById('room-label');
            if (roomLabel) roomLabel.textContent = `Room ${roomCode}`;
            
            try {
                if (isObserver) {
                    await tryObserveRoom();
                }
                await fetchRoomState();
            } catch (e) {
                console.warn('Failed to fetch initial room state:', e);
            }
            startSyncPolling({immediate: false});
            startRoomHeartbeat({immediate: true});
            refreshTurnUI();
            refreshInsightPanels();
        }

        initializeGame().catch(e => console.error('Initialization error:', e));
    </script>
</body>
</html>
