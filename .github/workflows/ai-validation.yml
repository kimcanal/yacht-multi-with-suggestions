name: Project Validation

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ai-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Validate Syntax
        run: |
          bash -n yacht-hosting.sh
          python -m compileall -q yacht_app yacht_core yacht_ai routes tests
          node --check static/js/ai_panel.js
          node --check static/js/score_utils.js
          node --check static/js/yacht_game.js
          node --check static/js/pages/lobby.js
          node --check static/js/pages/single-game.js
          node --check static/js/pages/multi-game.js

      - name: Run Route Integration Tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run AI Validation Suite
        run: |
          python scripts/verify_ai.py \
            --benchmark-repeats 1 \
            --warm-cases 120 \
            --cold-cases 40
