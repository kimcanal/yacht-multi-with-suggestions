name: AI Validation

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ai-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Hosting Script
        run: bash -n yacht-hosting.sh

      - name: Run Route Integration Tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run AI Validation Suite
        run: |
          python scripts/verify_ai.py \
            --benchmark-repeats 1 \
            --warm-cases 120 \
            --cold-cases 40
